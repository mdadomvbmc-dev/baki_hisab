# GitHub repo তে এই ফাইলটি .github/workflows/build.yml নামে রাখুন
# (Settings → Pages → Source = GitHub Actions করে রাখুন, নইলে deploy-web ফেইল করবে)
# আর প্রজেক্টের ZIP ফাইলটি repo এর root এ আপলোড করুন। বাকি সব অটো।
name: Build & Release
on:
  push: {branches: [main, master]}
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ZIP extract
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          if [ -z "$ZIP" ]; then echo "::error::repo এর root এ কোনো .zip ফাইল নেই"; exit 1; fi
          rm -rf /tmp/x && mkdir /tmp/x && unzip -q "$ZIP" -d /tmp/x
          P=$(find /tmp/x -name pubspec.yaml -not -path '*__MACOSX*' | head -n1)
          if [ -z "$P" ]; then echo "::error::ZIP এর ভেতরে pubspec.yaml নেই"; exit 1; fi
          mkdir -p src && cp -r "$(dirname "$P")"/. src/
          sed -i "s#OWNER/REPO#${{ github.repository }}#" src/lib/main.dart
      - uses: actions/upload-artifact@v4
        with: {name: src, path: src, include-hidden-files: true}

  android:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: src, path: app}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create . --platforms=android --org com.sobuj --project-name baki_hisab
      - run: python3 tools/patch_android.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f icons_android.yaml
      - name: Splash screen (লোগো)
        continue-on-error: true
        run: dart run flutter_native_splash:create --path=splash_android.yaml
      - run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk DharDena.apk
      - uses: actions/upload-artifact@v4
        with: {name: DharDena-apk, path: app/DharDena.apk}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dhar Dena v1.0.${{ github.run_number }}
          files: app/DharDena.apk

  windows:
    needs: [prep, android]
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: {run: {working-directory: app}}
    env:
      # Firebase C++ SDK এর পুরনো CMake সেটিং নতুন CMake 4.x এর সাথে চালানোর জন্য
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/download-artifact@v4
        with: {name: src, path: app}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create . --platforms=windows --org com.sobuj --project-name baki_hisab
      - name: Dhar Dena নাম
        shell: bash
        run: |
          sed -i 's/set(BINARY_NAME "baki_hisab")/set(BINARY_NAME "DharDena")/' windows/CMakeLists.txt
          sed -i 's/L"baki_hisab"/L"Dhar Dena"/' windows/runner/main.cpp
          # FIX: firebase_auth প্লাগিনের C4238 warning /WX এর কারণে error হচ্ছিল
          sed -i 's#/WX#/WX-#g' windows/CMakeLists.txt
          grep -n 'WX' windows/CMakeLists.txt
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f icons_windows.yaml
      - run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DharDena-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: app/DharDena-windows.zip

  web:
    needs: [prep, android]
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: src, path: app}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create . --platforms=web --org com.sobuj --project-name baki_hisab
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f icons_web.yaml
      - name: Splash screen (লোগো)
        continue-on-error: true
        run: dart run flutter_native_splash:create --path=splash_web.yaml
      - name: Web title ও নাম
        run: |
          sed -i 's#<title>.*</title>#<title>Dhar Dena - ধার দেনা</title>#' web/index.html
          sed -i 's#"name": "baki_hisab"#"name": "Dhar Dena"#; s#"short_name": "baki_hisab"#"short_name": "Dhar Dena"#' web/manifest.json
          sed -i 's#content="baki_hisab"#content="Dhar Dena"#' web/index.html
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Web ZIP (নিজের হোস্টিংয়ের জন্য)
        run: cd build/web && zip -qr ../../DharDena-web.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: app/DharDena-web.zip
      - uses: actions/upload-pages-artifact@v3
        with: {path: app/build/web}

  deploy-web:
    needs: web
    if: ${{ needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.dp.outputs.page_url }}
    steps:
      - id: dp
        uses: actions/deploy-pages@v4

  ios:
    needs: [prep, android]
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: src, path: app}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create . --platforms=ios --org com.sobuj --project-name baki_hisab
      - name: Dhar Dena নাম ও ছবির অনুমতি
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Dhar Dena" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Choose a shop logo photo" ios/Runner/Info.plist
      - run: sed -i '' "s/^# platform :ios, .*/platform :ios, '13.0'/" ios/Podfile
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f icons_ios.yaml
      - name: Splash screen (লোগো)
        continue-on-error: true
        run: dart run flutter_native_splash:create --path=splash_ios.yaml
      - run: flutter build ios --release --no-codesign --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - run: |
          mkdir Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr DharDena-ios-unsigned.ipa Payload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: app/DharDena-ios-unsigned.ipa
